name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Extract Project ZIP from Google Drive
      run: |
        echo "Насб кардани gdown барои зеркашӣ аз Google Drive..."
        pip install gdown
        
        echo "Файл аз Google Drive зеркашӣ шуда истодааст..."
        # Зеркашӣ бо истифода аз ID-и файли Google Drive
        gdown 1CZutmVR9gsv5wQ5HmsB0WlYlEaaGFgkB -O project.zip
        
        echo "Файл аз фишурдагӣ берун шуда истодааст (Extract)..."
        unzip -q project.zip -d extracted_project
        
        # Кӯчонидани файлҳо ба папкаи асосӣ
        cp -r extracted_project/* .
        
        echo "Сохтори папкаҳо бомуваффақият барқарор шуд!"

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
