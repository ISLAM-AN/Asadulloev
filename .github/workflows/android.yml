name: Test Download and Extract ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  test-zip:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download and Extract ZIP from Google Drive
      run: |
        echo "1. Насб кардани gdown..."
        pip install gdown
        
        echo "2. Зеркашӣ кардани ZIP..."
        gdown 1CZutmVR9gsv5wQ5HmsB0WlYlEaaGFgkB -O project.zip
        
        echo "3. Распаковка (Unzip) кардани файл..."
        unzip -q project.zip -d extracted_project
        
        echo "4. Рӯйхати файлҳо дар папкаи асосӣ:"
        ls -la
        
        echo "5. Рӯйхати файлҳо дар дохили extracted_project:"
        ls -la extracted_project
