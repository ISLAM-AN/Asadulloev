name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Extract ZIP from Google Drive
      run: |
        pip install gdown
        gdown 1CZutmVR9gsv5wQ5HmsB0WlYlEaaGFgkB -O project.zip
        unzip -q project.zip -d extracted_project
        
        # Кӯчонидани файлҳо аз папкаи Aya-1.4.0 ба папкаи асосӣ
        cp -r extracted_project/Aya-1.4.0/* .
        
        # Санҷиши файлҳо
        ls -la

    - name: Build APK with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aya-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
