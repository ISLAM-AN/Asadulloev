name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and Extract ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          pip install gdown

          gdown 1CZutmVR9gsv5wQ5HmsB0WlYlEaaGFgkB -O project.zip

          unzip -q project.zip -d extracted_project

          echo "=== ZIP CONTENTS ==="
          find extracted_project -maxdepth 4 -type f | sort

      - name: Find Android project
        run: |
          echo "=== Searching for Gradle wrapper ==="
          find extracted_project -name gradlew -type f -print

          echo "=== Searching for settings.gradle ==="
          find extracted_project -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted_project -name gradlew -type f | head -n 1)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aya-App-Debug
          path: '**/build/outputs/apk/debug/*.apk'
